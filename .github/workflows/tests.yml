name: TaskBell regression tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: node --check app.js && node --check core.js
      - name: Run tests
        run: npm test
